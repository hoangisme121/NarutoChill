<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Chill</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for modern, clean UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <script src="b.js" defer></script>

    
</head>
<body class="text-white h-screen w-screen relative">

    <!-- Background Video (Traffic/Driving Chill Vibe) -->
    <!-- Note: User can replace the src with their own local video path like "./bg-video.mp4" -->
    <div class="absolute inset-0 z-0">
        <video autoplay loop muted playsinline class="w-full h-full object-cover opacity-80 pointer-events-none">
            <source src="background/áaaa.mp4" type="video/mp4">
            <!-- Fallback image if video fails to load -->
            <img src="https://images.unsplash.com/photo-1516641887163-f22288de08f2?q=80&w=2070&auto=format&fit=crop" alt="Night Drive" class="w-full h-full object-cover">
        </video>
        <!-- Dark overlay to ensure text readability -->
        <div class="absolute inset-0 bg-black/30 z-10"></div>
    </div>

    <!-- Title / Watermark in Top Right -->
    <div class="absolute top-8 right-8 z-20 text-right">
        <h1 class="text-4xl font-semibold tracking-tight text-white/90 drop-shadow-lg">"The moment people come to know love, they run the risk of carrying hate."</h1>
        <p class="text-sm text-white/60 font-light mt-1">Obito Uchiha</p>
    </div>

    <!-- Music Player Widget -->
    <div id="player-container" class="absolute bottom-8 left-4 md:left-8 z-20 w-[340px] glass-panel rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all duration-300">
        
        <!-- Now Playing Info Section -->
        <div class="p-5 flex items-center gap-4">
            <div class="relative w-16 h-16 rounded-lg overflow-hidden flex-shrink-0 shadow-md">
                <img id="track-cover" src="https://placehold.co/100x100/222/FFF?text=Music" alt="Cover" class="w-full h-full object-cover">
                <!-- Playback animation indicator (simple pulsing overlay) -->
                <div id="playing-indicator" class="absolute inset-0 bg-black/40 hidden flex items-center justify-center">
                    <i class="ph ph-waveform text-emerald-400 text-xl animate-pulse"></i>
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <h2 id="track-title" class="text-base font-semibold truncate text-gray-100">Select a track</h2>
                <p id="track-artist" class="text-sm text-gray-400 truncate">Artist</p>
            </div>
        </div>

        <!-- Progress Bar Section -->
        <div class="px-5 pb-2">
            <div class="flex items-center justify-between text-xs text-gray-400 mb-1 font-mono">
                <span id="time-current">0:00</span>
                <span id="time-total">0:00</span>
            </div>
            <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full outline-none">
        </div>

        <!-- Controls Section -->
        <div class="px-5 pb-5 pt-3 flex items-center justify-center gap-6">
            <button id="btn-prev" class="text-gray-300 hover:text-white transition-colors transform hover:scale-110">
                <i class="ph-fill ph-skip-back text-2xl"></i>
            </button>
            <button id="btn-play-pause" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:bg-gray-200 transition-all transform hover:scale-105 shadow-lg">
                <i id="play-icon" class="ph-fill ph-play text-2xl ml-1"></i>
            </button>
            <button id="btn-next" class="text-gray-300 hover:text-white transition-colors transform hover:scale-110">
                <i class="ph-fill ph-skip-forward text-2xl"></i>
            </button>
        </div>

        <!-- Divider -->
        <div class="h-px w-full bg-white/10"></div>

        <!-- Playlist Section -->
        <div class="p-3">
            <div class="flex items-center justify-between px-2 mb-2">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Up Next</span>
                <i class="ph ph-list text-gray-400"></i>
            </div>
            <!-- Scrollable List -->
            <ul id="playlist" class="playlist-scroll max-h-[180px] overflow-y-auto pr-1 flex flex-col gap-1">
                <!-- Playlist items injected via JS -->
            </ul>
        </div>
    </div>


</body>
</html>
